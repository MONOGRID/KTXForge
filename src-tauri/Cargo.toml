[package]
name = "ktx-gui"
version = "0.0.0"
description = "KTX encoder and inspector"
authors = ["MONOGRID"]
edition = "2021"

[lib]
name = "ktx_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata.cargo-machete]
# build-dependencies are invisible to machete's graph; keep the Tauri build script linked.
ignored = ["tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "10", features = ["serde-compat"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
  "gif",
  "tiff",
  "exr",
  "hdr",
] }
exr = "1.74"
tempfile = "3"
ktx2 = "0.5"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "fs", "process", "time", "macros", "rt"] }
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.5.0"
